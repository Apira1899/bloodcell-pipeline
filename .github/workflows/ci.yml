name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  API_VERSION: "1.0.0"
  MODEL_VERSION: "1.0.0"

jobs:
  test:
    name: Lint + tests (api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

  build-and-push:
    name: Build + push image to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # allows GITHUB_TOKEN to push to ghcr.io (no extra secret)
    steps:
      - uses: actions/checkout@v4

      - name: Image name (ghcr.io/<owner>/<repo>/api, lowercase)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=${{ env.API_VERSION }}
            type=sha,format=long,prefix=

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests: build only (check that the Dockerfile works). Push to main: build + publish.
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          build-args: MODEL_VERSION=${{ env.MODEL_VERSION }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

